[package]
name = "minecraft-chibi-generator"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1" }
reqwest = { version = "0.13.5" }
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros"] }

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
codegen-units = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.release.package."*"]
opt-level = 3
